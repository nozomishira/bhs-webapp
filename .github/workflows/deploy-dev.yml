name: Deploy to S3 (dev)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # AWS認証を先に行う（API URL取得のため）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::459532536546:role/dev-apne1-github-actions-webapp-role
          aws-region: ap-northeast-1

      # API URL + Cognito 設定を CFn から動的取得して .env.production を生成
      - name: Generate .env.production
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name dev-bhs-indonesia-webapi \
            --region ap-northeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)

          COGNITO_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name dev-bhs-indonesia-auth \
            --region ap-northeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoDomain'].OutputValue" \
            --output text)

          COGNITO_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name dev-bhs-indonesia-auth \
            --region ap-northeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)

          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name dev-bhs-indonesia-webapp \
            --region ap-northeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text)

          echo "NEXT_PUBLIC_API_BASE_URL=$API_URL" > .env.production
          echo "NEXT_PUBLIC_COGNITO_DOMAIN=$COGNITO_DOMAIN" >> .env.production
          echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID" >> .env.production
          echo "NEXT_PUBLIC_AUTH_REDIRECT_URI=https://$CF_DOMAIN/auth/callback.html" >> .env.production
          echo "NEXT_PUBLIC_AUTH_LOGOUT_URI=https://$CF_DOMAIN" >> .env.production

          echo "Generated .env.production:"
          cat .env.production

      # API URL が埋め込まれた状態でビルド
      - name: Build
        run: npm run build

      - name: Get CloudFront Distribution ID
        id: cfn-outputs
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name dev-bhs-indonesia-webapp \
            --region ap-northeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" == "None" ]; then
            echo "::error::DistributionId not found in stack outputs."
            exit 1
          fi

          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to S3
        run: |
          aws s3 sync ./out/ s3://dev-apne1-bhs-indonesia-webapp/ \
            --region ap-northeast-1 \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn-outputs.outputs.distribution_id }} \
            --paths "/*"
