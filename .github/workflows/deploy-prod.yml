# ===================================================
# deploy-prod.yml
#
# prod環境用デプロイワークフロー（雛形）
# まだprod環境のCFnスタック（prod-bhs-indonesia-webapp等）が
# 存在しないため、全体をコメントアウトしている。
#
# prod環境構築後の有効化手順:
#   1. bhs-infra側でprod用CFnスタックを作成
#      （webapp/parameter-prod.json, cicd/parameter-prod.json を使用）
#   2. 下記を非コメント化
#   3. STACK_NAME / BUCKET_NAME をprod環境の値に置き換え（必要なら）
#   4. role-to-assume のARNをprod用IAMロールARNに置き換え
#      （prod-apne1-github-actions-role を想定）
#   5. mainブランチへのpushで動作確認
#      ※本番デプロイなので、必要に応じて environment: production の
#        承認フロー（GitHub Environments）を追加することを推奨
# ===================================================

name: Deploy to S3 (prod)

on:
  push:
    branches:
      - main

