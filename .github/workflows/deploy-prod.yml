# ===================================================
# deploy-prod.yml
# prod環境用デプロイワークフロー（雛形）
# prod環境のCFnスタック構築後に steps 内のコメントを外して有効化する
# ===================================================

name: Deploy to S3 (prod)

on:
  push:
    branches:
      - main  # mainブランチへのpushのみ起動（developでは動かない）

jobs:
  deploy:
    runs-on: ubuntu-latest
    # prod環境未構築のため全ステップをスキップする
    if: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::459532536546:role/prod-apne1-github-actions-role
          aws-region: ap-northeast-1
      - name: Get CloudFront Distribution ID
        id: cfn-outputs
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name prod-bhs-indonesia-webapp \
            --region ap-northeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" == "None" ]; then
            echo "::error::DistributionId not found in stack outputs."
            exit 1
          fi
          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"
      - name: Deploy to S3
        run: |
          aws s3 sync ./out/ s3://prod-apne1-bhs-indonesia-webapp/ \
            --region ap-northeast-1 \
            --delete
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn-outputs.outputs.distribution_id }} \
            --paths "/*"